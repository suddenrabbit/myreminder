<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e8ecf8" />
  <meta name="theme-color" content="#e8ecf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12151f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RabbitReminder" />
  <title>RabbitReminder · 卡片与会员到期提醒</title>
  <script>
    try {
      var pref = localStorage.getItem('mr_theme') || 'system';
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var color = dark ? '#12151f' : '#e8ecf8';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
        meta.setAttribute('content', color);
      });
    } catch (e) {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest?v=rabbit-v27" />
  <link rel="icon" href="/rabbit-wallet-192.png" />
  <link rel="apple-touch-icon" href="/rabbit-wallet-apple.png" />
  <link rel="stylesheet" href="/style.css?v=rabbit-v27" />
</head>
<body>
  <div id="status-bleed" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <div id="update-notice" class="update-notice" role="status" hidden>
    <span>新版本已就绪</span>
    <button id="apply-update" type="button">点击更新</button>
  </div>
  <script src="/brands.js?v=rabbit-v27"></script>
  <script src="/app.js?v=rabbit-v27"></script>
</body>
</html>
